name: iOS build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Validate project packaging
        run: python3 scripts/check_project.py
      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          python3 - "$RUNNER_TEMP/devices.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          for runtime, devices in data['devices'].items():
              if '.iOS-' not in runtime:
                  continue
              for device in devices:
                  if device.get('isAvailable') and device['name'].startswith('iPhone'):
                      print('id=' + device['udid'])
                      sys.exit(0)
          raise SystemExit('No iPhone simulator installed on this runner')
          PY
      - name: Boot iPhone simulator
        env:
          OPENWC_SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          xcrun simctl boot "$OPENWC_SIMULATOR_ID" || true
          xcrun simctl bootstatus "$OPENWC_SIMULATOR_ID" -b
      - name: Build and test on iPhone Simulator
        run: >-
          xcodebuild -project OpenWC.xcodeproj -scheme OpenWC
          -configuration Debug
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}'
          -derivedDataPath build -resultBundlePath build/TestResults.xcresult
          CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO test
      - name: Retain resolved dependency versions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resolved-swift-packages
          path: OpenWC.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if-no-files-found: ignore

      - name: Retain UI test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: build/TestResults.xcresult
          if-no-files-found: ignore

      - name: Export UI screenshots
        if: always()
        continue-on-error: true
        run: |
          xcrun xcresulttool export attachments --help
          xcrun xcresulttool export attachments --path build/TestResults.xcresult --output-path build/ui-screenshots
      - name: Retain UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-screenshots
          path: build/ui-screenshots
          if-no-files-found: ignore
